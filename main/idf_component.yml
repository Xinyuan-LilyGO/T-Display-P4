dependencies:
  idf: '>=5.5.4'

  common:
    override_path: "../libraries/common"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ES8311} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_TCA8418_LVGL_TOUCH_DRAW} == True"

  cpp_bus_driver:
    override_path: "../libraries/cpp_bus_driver"

  arduino_cpp_bus_driver:
    override_path: "../libraries/arduino_cpp_bus_driver"

  lilygo_device_driver:
    override_path: "../libraries/lilygo_device_driver"

  radiolib_cpp_bus_driver:
    override_path: "../libraries/radiolib_cpp_bus_driver"

  usp_cpp_bus_driver:
    override_path: "../libraries/usp_cpp_bus_driver"

  icm20948_we:
    override_path: "../libraries/icm20948_we"

  espressif/esp-sr:
    version: "^2.1.3"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_AFE} == True"

  lvgl/lvgl:
    version: "9.5.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_TCA8418_LVGL_TOUCH_DRAW} == True"

  espressif/ethernet_init:
    version: "^1.3.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_IPERF_ETHERNET} == True"

  espressif/iot_usbh_ecm:
    version: "^0.2.1"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_USB_IPERF_ETHERNET} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_USB_IPERF_ETHERNET_HOST_MSC} == True"

  espressif/iot_eth:
    version: "^1.0.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_USB_IPERF_ETHERNET} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_USB_IPERF_ETHERNET_HOST_MSC} == True"

  espressif/iperf-cmd:
    version: "^0.1.1"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_IPERF_ETHERNET} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_USB_IPERF_ETHERNET} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_USB_IPERF_ETHERNET_HOST_MSC} == True"

  usb_host_msc:
    version: "^1.2.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_USB_IPERF_ETHERNET_HOST_MSC} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_USB_HOST_MSC} == True"

  espressif/esp_audio_codec:
    version: "^2.4.1"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ES8311_SD_MP3} == True"

  ST25R3916:
    override_path: "../libraries/ST25R3916"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_NFC_RFAL_ST25R3916} == True"

  NFC-RFAL:
    override_path: "../libraries/NFC-RFAL"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_NFC_RFAL_ST25R3916} == True"
