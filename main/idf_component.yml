dependencies:
  lilygo_device_driver:
    override_path: "../libraries/lilygo_device_driver"

  private_library:
    override_path: "../libraries/private_library"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_ES8311} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_LVGL_9_UI} == True"
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4_KEYBOARD} == True && $CONFIG{EXAMPLE_BUILD_SCREEN_TCA8418_LVGL_TOUCH_DRAW} == True"

  espressif/esp-sr:
    version: "^2.1.3"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_AFE} == True"

  espressif/esp_hosted:
    version: "2.11.5"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_ESP_HOSTED_MCU_SDIO_WIFI} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_LVGL_9_UI} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_SLEEP} == True"

  espressif/esp_wifi_remote:
    version: "1.3.2"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_ESP_HOSTED_MCU_SDIO_WIFI} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_LVGL_9_UI} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_SLEEP} == True"

  esp_video_app_video:
    override_path: "../libraries/esp_video_app_video"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_SCREEN_CAMERA} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_LVGL_9_UI} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_SLEEP} == True"

  lvgl/lvgl:
    version: "9.4.0"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_SCREEN_LVGL} == True"
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_SCREEN_LVGL_TOUCH_DRAW} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_LVGL_9_UI} == True"
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4_KEYBOARD} == True && $CONFIG{EXAMPLE_BUILD_SCREEN_TCA8418_LVGL_TOUCH_DRAW} == True"

  espressif/esp_tinyusb:
    version: "^1"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_LVGL_9_UI} == True"

  espressif/ethernet_init:
    version: "^1.3.0"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_IPERF_ETHERNET} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_LVGL_9_UI} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_SLEEP} == True"

  espressif/iot_usbh_ecm:
    version: "^0.2.1"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_IPERF_ETHERNET_USB} == True"

  espressif/iot_eth:
    version: "^1.0.0"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_IPERF_ETHERNET_USB} == True"

  espressif/iperf-cmd:
    version: "^0.1.1"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_IPERF_ETHERNET} == True"
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_IPERF_ETHERNET_USB} == True"

  espressif/esp_audio_codec:
    version: "^2.4.1"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4} == True && $CONFIG{EXAMPLE_BUILD_ES8311_SD_MP3} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_LVGL_9_UI} == True"

  ST25R3916:
    override_path: "../libraries/ST25R3916"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4_KEYBOARD} == True && $CONFIG{EXAMPLE_BUILD_ST25R3916} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_LVGL_9_UI} == True"

  NFC-RFAL:
    override_path: "../libraries/NFC-RFAL"
    matches:
      - if: "$CONFIG{BOARD_TYPE_T_DISPLAY_P4_KEYBOARD} == True && $CONFIG{EXAMPLE_BUILD_ST25R3916} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_LVGL_9_UI} == True"
