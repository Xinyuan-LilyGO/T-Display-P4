dependencies:
  idf: '>=5.5.4'

  common:
    path: "../libraries/common"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ES8311_SD_WAV} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_ESP32C6_AT_HOST_SDIO_UART} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_ESP32C6_AT_HOST_SDIO_WIFI} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_TCA8418_LVGL_TOUCH_DRAW} == True"

  cpp_bus_driver:
    override_path: "../libraries/cpp_bus_driver"

  arduino_cpp_bus_driver:
    override_path: "../libraries/arduino_cpp_bus_driver"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_TCA8418_LVGL_TOUCH_DRAW} == True"

  lilygo_device_driver:
    override_path: "../libraries/lilygo_device_driver"

  radiolib_cpp_bus_driver:
    override_path: "../libraries/radiolib_cpp_bus_driver"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_RADIOLIB_SX1262_SEND_RECEIVE} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_CC1101_SEND_RECEIVE} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_RADIOLIB_CC1101_SEND_RECEIVE} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_RADIOLIB_NRF24L01_SEND_RECEIVE} == True"

  icm20948_we:
    override_path: "../libraries/icm20948_we"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_TCA8418_LVGL_TOUCH_DRAW} == True"

  usp_cpp_bus_driver:
    path: "../libraries/usp_cpp_bus_driver"

  stsw-st25rfal002_cpp_bus_driver:
    path: "../libraries/stsw-st25rfal002_cpp_bus_driver"

  ST25R3916:
    path: "../libraries/ST25R3916"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_NFC_RFAL_ST25R3916} == True"

  NFC-RFAL:
    path: "../libraries/NFC-RFAL"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_NFC_RFAL_ST25R3916} == True"

  espressif/esp-sr:
    version: "2.1.3"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_AFE} == True"

  lvgl/lvgl:
    version: "9.5.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_TCA8418_LVGL_TOUCH_DRAW} == True"

  espressif/ethernet_init:
    version: "1.3.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ETHERNET_IPERF} == True"

  espressif/iot_usbh_ecm:
    version: "0.2.1"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_USB_ETHERNET_IPERF} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_USB_ETHERNET_IPERF_HOST_MSC} == True"

  espressif/iot_eth:
    version: "1.0.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_USB_ETHERNET_IPERF} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_USB_ETHERNET_IPERF_HOST_MSC} == True"

  espressif/iperf-cmd:
    version: "0.1.1"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ETHERNET_IPERF} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_USB_ETHERNET_IPERF} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_USB_ETHERNET_IPERF_HOST_MSC} == True"

  usb_host_msc:
    version: "1.2.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_USB_ETHERNET_IPERF_HOST_MSC} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_USB_HOST_MSC} == True"
