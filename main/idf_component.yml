dependencies:
  cpp_bus_driver:
    override_path: "../libraries/cpp_bus_driver"

  lilygo_device_driver:
    override_path: "../libraries/lilygo_device_driver"

  private_library:
    override_path: "../libraries/private_library"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ES8311} == True"

  espressif/esp-sr:
    version: "^2.1.3"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_AFE} == True"

  espressif/esp_hosted:
    version: "2.11.5"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ESP_HOSTED_MCU_SDIO_WIFI} == True"

  espressif/esp_wifi_remote:
    version: "1.3.2"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ESP_HOSTED_MCU_SDIO_WIFI} == True"

  arduino_cpp_bus_driver:
    override_path: "../libraries/arduino_cpp_bus_driver"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ICM20948} == True"

  ICM20948_WE:
    override_path: "../libraries/ICM20948_WE"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ICM20948} == True"

  radiolib_bridge:
    override_path: "../libraries/radiolib_bridge"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_RADIOLIB_SX1262_SEND_RECEIVE} == True"

  esp_video_app_video:
    override_path: "../libraries/esp_video_app_video"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_CAMERA} == True"

  lvgl/lvgl:
    version: "9.4.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_LVGL} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_LVGL_TOUCH_DRAW} == True"

  espressif/esp_tinyusb:
    version: "^1"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_TUSB_SERIAL_DEVICE} == True"

  espressif/ethernet_init:
    version: "^1.3.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_IPERF_ETHERNET} == True"

  espressif/iperf-cmd:
    version: "^0.1.1"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_IPERF_ETHERNET} == True"

  espressif/esp_audio_codec:
    version: "^2.4.1"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_ES8311_SD_MP3} == True"
